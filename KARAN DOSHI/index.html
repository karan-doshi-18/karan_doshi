 <script type="text/babel" data-presets="react">

    function App() {

      const telUrl = `tel:${phoneNumber}`;

      // Custom Cursor Listener
      useEffect(() => {
        const handleMouseMove = (e) => {
          setCursorPos({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      // Initialize Three.js Ambient 3D Background
      useEffect(() => {
        const container = document.getElementById('canvas-3d-bg');
        if (!container || typeof THREE === 'undefined') return;

        container.innerHTML = '';
        const isMobile = window.innerWidth < 768;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = isMobile ? 35 : 30;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: !isMobile });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = isMobile ? 350 : 700;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x8B5CF6);
        const color2 = new THREE.Color(0x38BDF8);
        const color3 = new THREE.Color(0xEC4899);

        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 80;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 80;

          const mixedColor = color1.clone();
          const rand = Math.random();
          if (rand > 0.6) mixedColor.lerp(color2, Math.random());
          else if (rand > 0.3) mixedColor.lerp(color3, Math.random());

          colors[i * 3] = mixedColor.r;
          colors[i * 3 + 1] = mixedColor.g;
          colors[i * 3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: isMobile ? 0.3 : 0.25,
          vertexColors: true,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        const shapeGeo = new THREE.TorusKnotGeometry(isMobile ? 4.5 : 6, 1.5, 80, 16);
        const shapeMat = new THREE.MeshBasicMaterial({
          color: 0x8B5CF6,
          wireframe: true,
          transparent: true,
          opacity: 0.15
        });
        const torusKnot = new THREE.Mesh(shapeGeo, shapeMat);
        torusKnot.position.set(isMobile ? 0 : 18, isMobile ? 12 : 2, -10);
        scene.add(torusKnot);

        const octGeo = new THREE.OctahedronGeometry(isMobile ? 3 : 4, 1);
        const octMat = new THREE.MeshBasicMaterial({
          color: 0x38BDF8,
          wireframe: true,
          transparent: true,
          opacity: 0.18
        });
        const octahedron = new THREE.Mesh(octGeo, octMat);
        octahedron.position.set(isMobile ? -10 : -20, -10, -5);
        scene.add(octahedron);

        let mouseX = 0;
        let mouseY = 0;
        const handlePointerMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          mouseX = (clientX / window.innerWidth - 0.5) * 2;
          mouseY = (clientY / window.innerHeight - 0.5) * 2;
        };

        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchmove', handlePointerMove, { passive: true });

        const handleResize = () => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        };
        window.addEventListener('resize', handleResize);

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          particles.rotation.y += 0.0006;
          particles.rotation.x += 0.0003;

          torusKnot.rotation.x += 0.004;
          torusKnot.rotation.y += 0.006;

          octahedron.rotation.x -= 0.005;
          octahedron.rotation.z += 0.003;

          camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
          camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
          camera.lookAt(scene.position);

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          window.removeEventListener('mousemove', handlePointerMove);
          window.removeEventListener('touchmove', handlePointerMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          renderer.dispose();
        };
      }, []);

      const handleCopyPhone = () => {

                      <div className="flex justify-between items-center text-[9px] sm:text-[10px] text-pink-300 border-t border-gray-800/80 pt-2">
                        <span>COURSE: COMPUTER SCIENCE</span>
                        <span>COLLEGE: SNJB</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* CONTACT SECTION */}
          <section id="contact" className="py-16 sm:py-24 md:py-28 px-4 sm:px-6 relative z-10 overflow-hidden">
            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-72 sm:w-96 h-72 sm:h-96 bg-purple-600/20 rounded-full blur-3xl -z-10 pointer-events-none"></div>

            <div className="max-w-5xl mx-auto glass-panel rounded-2xl sm:rounded-3xl p-6 sm:p-10 md:p-14 border border-purple-500/40 shadow-2xl text-center space-y-6 sm:space-y-8 relative">
              <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 font-mono text-[11px] sm:text-xs uppercase tracking-wider">
                <i data-lucide="message-square" className="w-3.5 h-3.5"></i>
                <span>GET IN TOUCH</span>
              </div>

              <h2 className="font-syne text-3xl xs:text-4xl sm:text-6xl font-extrabold text-white tracking-tight">
                Let's Work <span className="text-gradient-purple">Together</span>
              </h2>

              <p className="text-gray-300 text-base sm:text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                "Have an idea or need a website? Let's create something amazing together."
              </p>

              <div className="glass-card rounded-2xl p-5 sm:p-6 max-w-lg mx-auto border border-gray-700/60 space-y-2 text-center">
                <div className="font-syne font-bold text-xl sm:text-2xl text-white">Karan Doshi</div>
                <div className="text-xs sm:text-sm font-mono text-purple-400">First-Year Computer Science Student</div>
                <div className="text-[11px] sm:text-xs text-gray-400">SNJB College • Department of Computer Science</div>
                <div className="text-xs sm:text-sm font-mono text-emerald-400 pt-2 flex items-center justify-center gap-2">
                  <i data-lucide="phone" className="w-4 h-4"></i>
                  <span>{formattedPhone}</span>
                </div>
              </div>

              <div className="flex flex-col xs:flex-row flex-wrap items-center justify-center gap-3 sm:gap-4 pt-2 sm:pt-4 w-full">
                <a 
                  href={whatsappUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full xs:w-auto px-6 sm:px-8 py-3.5 sm:py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-syne font-bold text-xs sm:text-sm tracking-wide shadow-lg shadow-emerald-600/30 hover:scale-105 transition-all duration-300 flex items-center justify-center gap-2.5 min-h-[48px]"
                >
                  <i data-lucide="message-circle" className="w-5 h-5"></i>
                  <span>Contact Me (WhatsApp)</span>
                </a>

                <a 
                  href={telUrl}
                  className="w-full xs:w-auto px-6 sm:px-8 py-3.5 sm:py-4 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-syne font-bold text-xs sm:text-sm tracking-wide shadow-lg shadow-purple-600/30 hover:scale-105 transition-all duration-300 flex items-center justify-center gap-2.5 min-h-[48px]"
                >
                  <i data-lucide="phone-call" className="w-5 h-5"></i>
                  <span>Direct Phone Call</span>
                </a>

                <button 
                  onClick={handleCopyPhone}
                  className="w-full xs:w-auto px-6 sm:px-8 py-3.5 sm:py-4 rounded-xl glass-panel hover:bg-white/10 text-gray-200 font-syne font-bold text-xs sm:text-sm border border-gray-700 transition-all flex items-center justify-center gap-2 min-h-[48px]"
                >
                  <i data-lucide="copy" className="w-4 h-4"></i>
                  <span>{copiedPhone ? "Copied 8275348027!" : "Copy Phone"}</span>
                </button>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="py-8 sm:py-12 border-t border-gray-800/80 px-4 sm:px-6 relative z-10 text-center text-gray-400 text-[11px] sm:text-xs font-mono">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                &copy; {new Date().getFullYear()} Karan Doshi. First-Year Computer Science Student • SNJB College.
              </div>
              <div className="flex items-center space-x-4">
                <a href="#hero" className="hover:text-purple-400 transition-colors">Back to Top &uarr;</a>
              </div>
            </div>
          </footer>

          {/* PHOTO LIGHTBOX MODAL */}
          {selectedPhoto && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 animate-fadeIn" onClick={() => setSelectedPhoto(null)}>
              <div className="relative max-w-[95vw] sm:max-w-3xl max-h-[90vh] rounded-2xl sm:rounded-3xl overflow-hidden border border-purple-500/40 p-2 glass-panel" onClick={(e) => e.stopPropagation()}>
                <button 
                  onClick={() => setSelectedPhoto(null)}
                  className="absolute top-3 right-3 sm:top-4 sm:right-4 p-2.5 rounded-full bg-black/70 text-white hover:bg-purple-600 transition-colors z-20 border border-white/20 min-w-[44px] min-h-[44px] flex items-center justify-center"
                >
                  <i data-lucide="x" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                </button>
                <img src={selectedPhoto} alt="Karan Doshi Preview" className="w-full h-full object-contain rounded-xl sm:rounded-2xl max-h-[80vh]" />
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
